<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>STYLISH | تواصل معنا</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');

:root{
    --bg:#0b0b0b;
    --card:#141414;
    --border:#262626;
    --text:#f5f5f5;
    --muted:#8d8d8d;
    --accent:#d4b98c;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    min-height:100%;
}

body{
    font-family:'Cairo',system-ui,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 50% -20%, #1f1f1f, transparent 55%),
        var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom));
}

.wrap{
    width:100%;
    max-width:380px;
    text-align:center;
}

/* ===== BRAND ===== */

.logo{
    font-size:46px;
    font-weight:800;
    letter-spacing:10px;
    padding-right:10px;
    color:var(--text);
}

.line{
    width:46px;
    height:2px;
    background:var(--accent);
    margin:14px auto 12px;
    border-radius:2px;
}

.sub{
    color:var(--muted);
    font-size:14px;
    margin-bottom:34px;
}

/* ===== LINKS ===== */

.links{
    display:grid;
    gap:12px;
}

.card{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:14px 16px;
    text-decoration:none;
    color:var(--text);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    font-family:inherit;
    font-size:inherit;
    cursor:pointer;
    text-align:inherit;
    transition:transform .18s ease, border-color .18s ease;
    will-change:transform;
}

.card:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
}

.card:active{
    transform:scale(.97);
}

.icon{
    width:46px;
    height:46px;
    flex:0 0 46px;
    display:grid;
    place-items:center;
    border-radius:14px;
    background:#1d1d1d;
    color:var(--accent);
}

.icon svg{
    width:23px;
    height:23px;
    fill:currentColor;
}

.info{
    flex:1;
    text-align:right;
}

.name{
    font-size:17px;
    font-weight:700;
}

.desc{
    font-size:12px;
    color:var(--muted);
    margin-top:1px;
}

.desc.num{
    direction:ltr;
    text-align:right;
    font-size:13px;
    letter-spacing:1px;
}

.arrow{
    color:var(--muted);
    font-size:18px;
}

.footer{
    margin-top:30px;
    font-size:11px;
    color:#555;
    letter-spacing:2px;
}

/* ===== POPUP (SHEET) ===== */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    transition:opacity .2s ease, visibility .2s ease;
    z-index:50;
}

.overlay.open{
    opacity:1;
    visibility:visible;
}

.sheet{
    width:100%;
    max-width:420px;
    background:var(--card);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:24px 24px 0 0;
    padding:
        12px 18px
        max(20px, env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .25s ease;
    text-align:center;
}

.overlay.open .sheet{
    transform:translateY(0);
}

.grip{
    width:38px;
    height:4px;
    background:#333;
    border-radius:4px;
    margin:0 auto 16px;
}

.sheet h3{
    font-size:18px;
    font-weight:800;
}

.sheet .hint{
    font-size:12px;
    color:var(--muted);
    margin:4px 0 16px;
}

.sheet .hint b{
    direction:ltr;
    unicode-bidi:embed;
    letter-spacing:1px;
    font-weight:600;
    color:var(--text);
}

.options{
    display:grid;
    gap:10px;
}

.cancel{
    justify-content:center;
    margin-top:10px;
    background:transparent;
    color:var(--muted);
    font-weight:600;
    font-size:15px;
    padding:12px;
}

.cancel:hover{
    transform:none;
    border-color:var(--border);
}

@media (prefers-reduced-motion:reduce){
    .card, .overlay, .sheet{transition:none}
}
</style>
</head>

<body>

<script>
/* صوت الضغط - بيتولد بالكود، خفيف ومفيهوش ملفات */
(function(){
    let ctx = null;

    function getCtx(){
        if(!ctx){
            const AC = window.AudioContext || window.webkitAudioContext;
            if(AC) ctx = new AC();
        }
        if(ctx && ctx.state === "suspended") ctx.resume();
        return ctx;
    }

    function click(){
        try{
            const c = getCtx();
            if(!c) return;

            const t = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();

            osc.type = "sine";
            osc.frequency.setValueAtTime(880, t);
            osc.frequency.exponentialRampToValueAtTime(520, t + 0.09);

            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);

            osc.connect(gain);
            gain.connect(c.destination);

            osc.start(t);
            osc.stop(t + 0.13);
        }catch(e){}
    }

    document.querySelectorAll(".card").forEach(function(el){
        el.addEventListener("pointerdown", click, {passive:true});
    });

    /* ===== POPUP ===== */
    const overlay = document.getElementById("overlay");
    const openBtn = document.getElementById("openContact");
    const closeBtn = document.getElementById("closeContact");

    function openSheet(){
        overlay.classList.add("open");
        overlay.setAttribute("aria-hidden","false");
        history.pushState({sheet:1}, "");
    }

    function closeSheet(fromPop){
        if(!overlay.classList.contains("open")) return;
        overlay.classList.remove("open");
        overlay.setAttribute("aria-hidden","true");
        if(!fromPop && history.state && history.state.sheet){
            history.back();
        }
    }

    openBtn.addEventListener("click", openSheet);
    closeBtn.addEventListener("click", function(){ closeSheet(false); });

    overlay.addEventListener("click", function(e){
        if(e.target === overlay) closeSheet(false);
    });

    window.addEventListener("popstate", function(){ closeSheet(true); });

    document.addEventListener("keydown", function(e){
        if(e.key === "Escape") closeSheet(false);
    });
})();
</script>
